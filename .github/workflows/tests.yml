name: Capstone API tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Прогін тестів
        run: mvn -B -q test
      - name: Нотатка про результат
        if: success()
        run: |
          echo "::notice title=Capstone::API-тести зелені. Прикріпи посилання на цей прогін як артефакт у курсі."
